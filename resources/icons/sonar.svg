<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="sonarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48b774" stop-opacity="0"/>
      <stop offset="50%" stop-color="#48b774" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#48b774" stop-opacity="0.38"/>
    </linearGradient>
  </defs>
  <!-- Phosphor sweep trail sector (45 degree arc behind the beam) -->
  <path d="M12 12 L18.8 5.2 A9.62 9.62 0 0 0 12 2.38 Z" fill="url(#sonarSweep)"/>
  <!-- Concentric radar range rings -->
  <circle cx="12" cy="12" r="10.5" stroke="#48b774" stroke-width="1.5"/>
  <circle cx="12" cy="12" r="7" stroke="#48b774" stroke-width="1.1" stroke-opacity="0.5"/>
  <circle cx="12" cy="12" r="3.5" stroke="#48b774" stroke-width="1" stroke-opacity="0.75"/>
  <!-- Crosshairs / quadrant axes (reticle) -->
  <line x1="1.5" y1="12" x2="9.5" y2="12" stroke="#48b774" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="14.5" y1="12" x2="22.5" y2="12" stroke="#48b774" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="12" y1="1.5" x2="12" y2="9.5" stroke="#48b774" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="12" y1="14.5" x2="12" y2="22.5" stroke="#48b774" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Sweeping scanner beam -->
  <line x1="12" y1="12" x2="18.8" y2="5.2" stroke="#48b774" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Detected network targets / ping blips -->
  <circle cx="15.8" cy="4.8" r="1.25" fill="#48b774"/>
  <circle cx="16.5" cy="14.5" r="1.1" fill="#48b774" fill-opacity="0.85"/>
  <circle cx="6.5" cy="16" r="1.1" fill="#48b774" fill-opacity="0.55"/>
  <!-- Center radar transceiver / antenna hub -->
  <circle cx="12" cy="12" r="1.6" fill="#48b774"/>
</svg>
